apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA / Sigstore bundle (IVP) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
        scope: '*'
  matchImageReferences:
    - glob: 'dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*'
  credentials:
    secrets:
      - regcred
  attestors:
    - name: githubWorkflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/dolisss/pov-attestation-test/\.github/workflows/jfrog-attestation\.yml@.+$'
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: provenance
      intoto:
        type: 'https://slsa.dev/provenance/v1'
  validations:
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.provenance, [attestors.githubWorkflow])
        ).all(e, e > 0)
      message: >-
        Image not attested 
