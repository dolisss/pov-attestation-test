apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA provenance (GitHub OIDC) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-jfrog-nginx-sigstore-bundle
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "*"
          imageRegistryCredentials:
            secrets:
              - regcred
          failureAction: Enforce
          type: SigstoreBundle
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/dolisss/pov-attestation-test/\\.github/workflows/jfrog-attestation\\.yml@"
                        rekor:
                          url: https://rekor.sigstore.dev
                          ignoreTlog: true
