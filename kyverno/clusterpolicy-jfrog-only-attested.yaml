# Same shape as clusterpolicy-jfrog-customer-slsa.yaml: one verifyImages rule.
# When a Pod uses this JFrog image, Kyverno requires a Sigstore bundle + SLSA provenance v1
# signed by the expected GitHub Actions workflow identity.
#
# This does NOT reject Pods that use other images (docker.io, etc.). Those simply don’t match
# imageReferences and are unaffected. Add a separate allowlist/deny policy only if you must
# block every image except this path.
#
# Private JFrog: secret jfrog-docker-pull in kyverno namespace (see docker-registry create examples).

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA provenance (GitHub OIDC) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-jfrog-nginx-sigstore-bundle
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*"
          imageRegistryCredentials:
            secrets:
              - jfrog-docker-pull
          failureAction: Enforce
          type: SigstoreBundle
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/dolisss/pov-attestation-test/\\.github/workflows/jfrog-attestation\\.yml@"
                        rekor:
                          url: https://rekor.sigstore.dev
                          ignoreTlog: true
