# Kyverno SigstoreBundle + GitHub attestations: use exact `subject` (matches Fulcio URI SAN)
# and ctlog.ignoreSCT — see https://main.kyverno.io/docs/policy-types/cluster-policy/verify-images/sigstore/
#
# If admission still fails, compare `subject` to your cert:
#   gh attestation verify oci://dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx@sha256:<digest> \
#     --repo dolisss/pov-attestation-test --bundle-from-oci --format json | jq '.[0].verificationResult.signature.certificate'
# Adjust subject for your branch/tag (e.g. @refs/tags/v1) or add another keyless entry under entries.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA provenance (GitHub OIDC) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-jfrog-nginx-sigstore-bundle
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*"
          failureAction: Enforce
          type: SigstoreBundle
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/dolisss/pov-attestation-test/.github/workflows/jfrog-attestation.yml@refs/heads/main
                        ctlog:
                          ignoreSCT: true
                        rekor:
                          url: https://rekor.sigstore.dev
                          ignoreTlog: true
