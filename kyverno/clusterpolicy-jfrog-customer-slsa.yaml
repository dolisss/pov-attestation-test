# If verification fails with "no matching signatures" and the attestation is valid:
# 1) GitHub/artifact attestation often has empty tlog (see slsa-*.sigstore.json "tlogEntries: []");
#    set rekor.ignoreTlog: true so public Rekor is not required.
# 2) Kyverno fetches the Sigstore bundle from the *registry* (OCI referrers), not from
#    reference-customer-slsa-decoded.json — the file is only a human-readable decode.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: jfrog-msanalysissrv-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA provenance (GitHub OIDC) for JFrog msanalysissrv image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-jfrog-image-sigstore-bundle
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "*"
          failureAction: Enforce
          type: SigstoreBundle
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        # Matches Fulcio URI SAN (reusable workflow that actually signed).
                        subjectRegExp: "^https://github\\.com/ATT-IDP/revup-workflows/\\.github/workflows/reusable_workflow_java_ci\\.yaml@refs/tags/v[0-9]+$"
                        rekor:
                          url: https://rekor.sigstore.dev
                          # Required when the bundle has no public Rekor entry (tlogEntries: [])
                          ignoreTlog: true