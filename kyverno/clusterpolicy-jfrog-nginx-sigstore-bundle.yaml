# ClusterPolicy: verifyImages.type SigstoreBundle (GitHub OCI Sigstore bundles).
#
# NOTE: Some Kyverno versions surface internal Sigstore verifier errors (e.g. Verifier must specify
# WithObserverTimestamps / WithNoObserverTimestamps) instead of a helpful message. If you want the
# operator-facing text with gh/oras commands, delete THIS ClusterPolicy and enforce ONLY:
#   kyverno/imagevalidatingpolicy-jfrog-nginx-slsa.yaml
#
# Do not apply both IVP and this ClusterPolicy for the same images.
#
# Secrets: docker-registry secret regcred in namespace kyverno for private JFrog.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: jfrog-nginx-sigstore-bundle
  annotations:
    policies.kyverno.io/title: GitHub Sigstore bundle + SLSA provenance for JFrog nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-github-attestation-bundle
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*"
          failureAction: Enforce
          type: SigstoreBundle
          imageRegistryCredentials:
            secrets:
              - regcred
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/dolisss/pov-attestation-test/.github/workflows/jfrog-attestation.yml@refs/heads/main
                        ctlog:
                          ignoreSCT: true
                        rekor:
                          url: https://rekor.sigstore.dev
                          ignoreTlog: true
