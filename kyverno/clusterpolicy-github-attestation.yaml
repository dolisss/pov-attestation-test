# Verifies GitHub Actions Sigstore bundle + SLSA provenance v1 for images pushed by .github/workflows/jfrog-attestation.yml
# (actions/attest-build-provenance with push-to-registry: true).
#
# imageReferences match jfrog-attestation.yml push target: dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx
# Tune subjectRegExp only if you rename the workflow file or move the repo.
#
# Prerequisites: Kyverno 1.13+ with SigstoreBundle image verification.
# If bundles show tlogEntries: [], consider rekor.ignoreTlog: true on the attestor (see Kyverno docs).

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-github-container-attestation-jfrog
  annotations:
    policies.kyverno.io/title: Require GitHub SLSA provenance on JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-jfrog-nginx-from-pov-workflow
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*"
          failureAction: Enforce
          type: SigstoreBundle
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subjectRegExp: "^https://github\\.com/dolisss/pov-attestation-test/\\.github/workflows/jfrog-attestation\\.yml@"
                        rekor:
                          url: https://rekor.sigstore.dev
