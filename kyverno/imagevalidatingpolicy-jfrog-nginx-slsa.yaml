# ImageValidatingPolicy (Kyverno 1.17+)
# GitHub actions/attest-build-provenance attaches v0.3 Sigstore bundles as OCI *referrers*
# (media type application/vnd.dev.sigstore.bundle.v0.3+json), not legacy cosign intoto blobs.
# Use `referrer` (not only `intoto`) so verifyAttestationSignatures can find the bundle.
#
# Docs: https://kyverno.io/docs/policy-types/image-validating-policy/
# Private JFrog: regcred in kyverno namespace (see credentials below).

apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA provenance (GitHub OIDC) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
        scope: '*'
  matchImageReferences:
    - glob: 'dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*'
  credentials:
    secrets:
      - regcred
  attestors:
    - name: githubWorkflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/dolisss/pov-attestation-test/.github/workflows/jfrog-attestation.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    # OCI referrer artifact type for GitHub Artifact Attestations / actions/attest-build-provenance
    - name: sigstoreBundle
      referrer:
        type: application/vnd.dev.sigstore.bundle.v0.3+json
  validations:
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.sigstoreBundle, [attestors.githubWorkflow])
        ).all(e, e > 0)
      message: >-
        Image must have a valid GitHub Sigstore bundle (SLSA provenance) for jfrog-attestation.yml
        on refs/heads/main. Pin digest or use tag that has referrers in JFrog; confirm with
        `oras discover` / `gh attestation verify --bundle-from-oci`.
