# ImageValidatingPolicy (Kyverno 1.17+). Admission denials use spec.validations[].message (below).
#
# For clearer operator-facing errors + gh/oras hints, enforce THIS policy and DELETE ClusterPolicy
# jfrog-nginx-sigstore-bundle — ClusterPolicy verifyImages SigstoreBundle often surfaces raw
# Sigstore verifier internals (e.g. WithObserverTimestamps / Verifier init) instead of this text.
#
# Do not enforce both IVP and clusterpolicy-jfrog-nginx-sigstore-bundle on the same images.
#
# GitHub attest-build-provenance uses OCI referrers:
#   application/vnd.dev.sigstore.bundle.v0.3+json
#
# Docs: https://kyverno.io/docs/policy-types/image-validating-policy/

apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: jfrog-nginx-slsa-provenance
  annotations:
    policies.kyverno.io/title: SLSA / Sigstore bundle (IVP) for JFrog nirmatainstaller/nginx
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
        scope: '*'
  matchImageReferences:
    - glob: 'dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx*'
  credentials:
    secrets:
      - regcred
  attestors:
    - name: githubWorkflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/dolisss/pov-attestation-test/.github/workflows/jfrog-attestation.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: sigstoreBundle
      referrer:
        type: application/vnd.dev.sigstore.bundle.v0.3+json
  validations:
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.sigstoreBundle, [attestors.githubWorkflow])
        ).all(e, e > 0)
      message: >-
        This image must have GitHub Artifact Attestation (Sigstore bundle v0.3 on OCI referrers) produced by
        .github/workflows/jfrog-attestation.yml on refs/heads/main for repo dolisss/pov-attestation-test.
        Confirm with: gh attestation verify oci://dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx@sha256:<digest>
        --repo dolisss/pov-attestation-test --bundle-from-oci
        Or: oras discover dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx@sha256:<digest>
        Pin a digest/tag that has referrers in JFrog; ensure Kyverno can pull (secret regcred in kyverno ns).
