# Pull nginx 1.25, push to JFrog, then actions/attest-build-provenance@v2 with push-to-registry.
# Sigstore bundle is attached to the image on Artifactory as OCI referrers (same pattern as jfrog-attestation.yml).
#
# jf evd create (JFrog Evidence) is not used here: it returns 403 unless the tenant has Enterprise+
# ("evidence deployment requires an Enterprise+ license").
#
# Secrets: JFROG_USER, JFROG_TOKEN (Docker login to dolisss.jfrog.io)

name: Push nginx 1.25 to JFrog with attestations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jfrog-attestation-jf-cli-evidence.yml

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  JFROG_DOCKER_REGISTRY: dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx
  IMAGE_TAG: "1.25"
  UPSTREAM_IMAGE: nginx:1.25

jobs:
  push-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Docker login hostname
        id: jfrog
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          echo "login_host=${REG_PREFIX%%/*}" >> "${GITHUB_OUTPUT}"

      - name: Log in to JFrog
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.jfrog.outputs.login_host }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull nginx, retag, push to JFrog, capture digest
        id: push
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          set -euo pipefail
          DEST_IMAGE="${REG_PREFIX}:${{ env.IMAGE_TAG }}"
          docker pull "${{ env.UPSTREAM_IMAGE }}"
          docker tag "${{ env.UPSTREAM_IMAGE }}" "${DEST_IMAGE}"
          PUSH_OUTPUT="$(docker push "${DEST_IMAGE}" 2>&1)"
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST="$(echo "${PUSH_OUTPUT}" | grep 'digest: sha256:' | tail -1 | sed -E 's/.*digest: (sha256:[a-f0-9]+).*/\1/')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Could not parse digest from docker push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.JFROG_DOCKER_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
