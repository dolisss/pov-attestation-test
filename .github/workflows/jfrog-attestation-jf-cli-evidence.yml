# Push nginx 1.25 to Artifactory, generate GitHub build provenance, then upload the Sigstore bundle
# to JFrog Evidence (Evidence tab in the UI), not as OCI referrers on the image.
#
# - push-to-registry: false — avoids attaching the bundle under image metadata / OCI referrers.
# - jf evd create --sigstore-bundle — registers evidence so it appears in the JFrog Evidence experience.
#
# JFrog blocks Evidence deployment without the right license (HTTP 403:
#   "evidence deployment requires an Enterprise+ license"). The workflow is correct; the tenant
#   must have Evidence / Enterprise+ for this step to succeed. Contact JFrog to enable it.
#
# Secrets: JFROG_USER, JFROG_TOKEN (Docker + JFrog CLI: JF_ACCESS_TOKEN maps to this secret)

name: Push nginx 1.25 to JFrog — Evidence (Sigstore bundle)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jfrog-attestation-jf-cli-evidence.yml

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  JFROG_DOCKER_REGISTRY: dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx
  IMAGE_TAG: "1.25"
  UPSTREAM_IMAGE: nginx:1.25
  YAML_ARTIFACTS_SERVER: https://dolisss.jfrog.io

jobs:
  push-image-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Docker login hostname
        id: jfrog
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          echo "login_host=${REG_PREFIX%%/*}" >> "${GITHUB_OUTPUT}"

      - name: Log in to JFrog (Docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.jfrog.outputs.login_host }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull nginx, retag, push to JFrog, capture digest
        id: push
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          set -euo pipefail
          DEST_IMAGE="${REG_PREFIX}:${{ env.IMAGE_TAG }}"
          docker pull "${{ env.UPSTREAM_IMAGE }}"
          docker tag "${{ env.UPSTREAM_IMAGE }}" "${DEST_IMAGE}"
          PUSH_OUTPUT="$(docker push "${DEST_IMAGE}" 2>&1)"
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST="$(echo "${PUSH_OUTPUT}" | grep 'digest: sha256:' | tail -1 | sed -E 's/.*digest: (sha256:[a-f0-9]+).*/\1/')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Could not parse digest from docker push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.YAML_ARTIFACTS_SERVER }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Generate build provenance (bundle only; not pushed to registry OCI metadata)
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.JFROG_DOCKER_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Upload Sigstore bundle to JFrog Evidence
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_PATH}" ] || [ ! -f "${BUNDLE_PATH}" ]; then
            echo "::error::Missing attestation bundle at bundle-path output"
            exit 1
          fi
          jf evd create --sigstore-bundle "${BUNDLE_PATH}"
