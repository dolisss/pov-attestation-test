# Pull nginx 1.25, docker push to Artifactory, attest (default: no push-to-registry), then
#   jf evd create --sigstore-bundle <bundle-path>
#
# Repository secrets (only these required):
#   - JFROG_USER / JFROG_TOKEN — Docker login; same token is passed to JFrog CLI as JF_ACCESS_TOKEN.
# Platform URL is hardcoded in env YAML_ARTIFACTS_SERVER (JF_URL).
#
# JFrog: Evidence enabled; token must allow evidence create. If subject resolution fails, see
#   https://docs.jfrog.com/governance/docs/create-evidence-cli (--subject-repo-path).

name: Push nginx 1.25 to JFrog — attest via JFrog CLI (Evidence)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jfrog-attestation-jf-cli-evidence.yml

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  JFROG_DOCKER_REGISTRY: dolisss.jfrog.io/nginx-docker/nirmatainstaller/nginx
  IMAGE_TAG: "1.25"
  UPSTREAM_IMAGE: nginx:1.25
  # JFrog Platform URL for setup-jfrog-cli (JF_URL)
  YAML_ARTIFACTS_SERVER: https://dolisss.jfrog.io

jobs:
  push-attest-jf-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Docker login hostname
        id: jfrog
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          echo "login_host=${REG_PREFIX%%/*}" >> "${GITHUB_OUTPUT}"

      - name: Log in to JFrog (Docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.jfrog.outputs.login_host }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull nginx, retag, push to JFrog, capture digest
        id: push
        env:
          REG_PREFIX: ${{ env.JFROG_DOCKER_REGISTRY }}
        run: |
          set -euo pipefail
          DEST_IMAGE="${REG_PREFIX}:${{ env.IMAGE_TAG }}"
          docker pull "${{ env.UPSTREAM_IMAGE }}"
          docker tag "${{ env.UPSTREAM_IMAGE }}" "${DEST_IMAGE}"
          PUSH_OUTPUT="$(docker push "${DEST_IMAGE}" 2>&1)"
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST="$(echo "${PUSH_OUTPUT}" | grep 'digest: sha256:' | tail -1 | sed -E 's/.*digest: (sha256:[a-f0-9]+).*/\1/')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Could not parse digest from docker push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.YAML_ARTIFACTS_SERVER }}
          # CLI expects JF_ACCESS_TOKEN; reuse the same Artifactory token as Docker login.
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Generate build provenance attestation (bundle only; no OCI referrer push)
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.JFROG_DOCKER_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Push attestation bundle to JFrog Evidence
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_PATH}" ] || [ ! -f "${BUNDLE_PATH}" ]; then
            echo "::error::Missing attestation bundle at bundle-path output"
            exit 1
          fi
          jf evd create --sigstore-bundle "${BUNDLE_PATH}"
