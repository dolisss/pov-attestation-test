# Build/push to Docker Hub, then actions/attest-build-provenance@v2 (→ GitHub Sigstore, push attestation to registry).
# Requires secrets: DOCKER_USERNAME, DOCKER_PASSWORD (Docker Hub PAT with push).

name: Build and push with attestations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker-attestation.yml

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  REGISTRY: docker.io
  # Full image path (no tag); must match the registry you log in to.
  IMAGE_NAME: nirmatainstaller/nginx
  IMAGE_TAG: github-attestation

jobs:
  build-push-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
